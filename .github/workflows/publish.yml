name: Publish

on:
  push:
    tags:
      - "v*/release" # PyPI
      - "v**test*" # TestPyPI

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - run: uv build
      - uses: actions/upload-artifact@v5
        with:
          name: python-package-distributions
          path: dist/

  publish-testpypi:
    name: Publish to TestPyPI
    if: contains(github.ref_name, 'test')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: test
      url: https://test.pypi.org/p/paramnormal
    permissions:
      id-token: write
    steps:
      - uses: astral-sh/setup-uv@v7
      - uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/
      - run: uv publish --trusted-publishing always --publish-url https://test.pypi.org/legacy/

  publish-pypi:
    name: Publish to PyPI
    if: endsWith(github.ref_name, '/release')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://pypi.org/p/paramnormal
    permissions:
      id-token: write
    steps:
      - uses: astral-sh/setup-uv@v7
      - uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/
      - run: uv publish --trusted-publishing always

  github-release:
    name: Create GitHub release
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/
      - uses: sigstore/gh-action-sigstore-python@v3.0.1
        with:
          inputs: ./dist/*.tar.gz ./dist/*.whl
      - name: Create release and upload artifacts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          gh release create '${{ github.ref_name }}' dist/**
          --repo '${{ github.repository }}' --generate-notes
